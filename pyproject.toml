[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psychic-waffle"
version = "0.1.0"
description = "Project for speech emotion recognition"
readme = "README.md"
requires-python = "==3.12.4"
dependencies = [
  "coloredlogs",
  "librosa",
  "numpy",
  "torch",
  "torchaudio",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[project.scripts]
psy = "psychic.__main__:main"

[tool.setuptools.packages.find]
include = ["psychic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
